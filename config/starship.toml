# starship configuration
# ----------------------

# The format of the prompt
format = """
$time\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Show the time
[time]
disabled = false
format = "[$time]($style) "
style = "bold yellow"
use_12hr = false

# Show command duration
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

# Directory settings
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = "@"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
stashed = '\$'
modified = "!"
staged = "+"
renamed = "r"
deleted = "x"

[character]
success_symbol = "[❯](bold #FFA500)"
error_symbol = "[❯](bold red)"
