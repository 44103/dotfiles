# starship configuration
# ----------------------

# The format of the prompt (Pure style custom)
format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Show the time
[time]
disabled = false
format = "[$time]($style) "
style = "bold yellow"
use_12hr = false

# Show command duration
[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "yellow"

# Directory settings
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[username]
style_user = "bold white"
style_root = "black bold"
format = "[$user]($style) "
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname]($style) "
style = "bold white"
disabled = false

[git_branch]
symbol = ""
format = "[$symbol$branch]($style) "
style = "bright-black"

[git_status]
format = "([$all_status$ahead_behind$stashed]($style))"
style = "red"
conflicted = "!"
untracked = "?"
modified = "*"
staged = "+"
renamed = "r"
deleted = "x"
stashed = '\$'
ahead = "⇡${count}"
behind = "⇣${count}"


[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[character]
success_symbol = "[❯](bold #FFA500)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
